name: Test features

on:
  workflow_dispatch:
  pull_request:
  # Callable as a job from another workflow, which is what makes `needs: test` work across two
  # files: release.yaml runs this and only publishes if it comes back green. There is deliberately
  # no push trigger -- a push to main reaches these tests through release.yaml, and a push trigger
  # here as well would just run the whole matrix twice for the same commit.
  workflow_call:

jobs:
  # Seconds, no Docker, and it fails on the class of mistake that otherwise surfaces three minutes
  # into an image build. Deliberately not a prerequisite of the matrix below: a lint finding should
  # not hide a real test failure, so both run and both report.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to the runner's own shellcheck rather than installing one, so a new release cannot
      # turn a green branch red on its own.
      - name: Lint
        # STRICT=1 so a runner image without shellcheck fails here rather than skipping the check
        # and reporting green.
        run: make lint STRICT=1

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Spelled out per feature rather than as a bare list, because sandbox cannot run on the
      # same base as the rest: its tests have to become root to check what the *remote user* can
      # no longer reach, and the plain node image ships no sudo.
      matrix:
        include:
          - { feature: claude,          image: node, user: node }
          - { feature: git-config,      image: node, user: node }
          - { feature: persist-homedir, image: node, user: node }
          - { feature: tidewave,        image: node, user: node }
          - { feature: sandbox,         image: 'mcr.microsoft.com/devcontainers/javascript-node:20', user: node }
          # egress-filter needs iptables and a proxy, so it wants a full base image too.
          - { feature: egress-filter,   image: 'mcr.microsoft.com/devcontainers/javascript-node:20', user: node }
    steps:
      - uses: actions/checkout@v7

      - name: Install the devcontainer CLI
        run: npm install -g @devcontainers/cli

      # git-config and egress-filter bind-mount host paths, and a bind mount whose source is
      # missing stops the container from starting outright — Docker does not create it. A runner
      # has neither directory. (claude mounts nothing; it seeds settings from its option.)
      - name: Create host config paths
        run: |
          mkdir -p ~/.config/git ~/.config/egress-filter
          git config -f ~/.config/git/config user.name "CI"
          printf 'ci-canary-pattern\n' > ~/.config/git/ignore
          # The global egress allowlist. Left almost empty on purpose: the tests allow what they
          # need at runtime, so they do not depend on this file's contents.
          printf '# global egress allowlist (CI)\n' > ~/.config/egress-filter/allowlist.txt

      - name: Test ${{ matrix.feature }}
        # -i/-u matter: these features key off the remote user's home, so the default
        # ubuntu:focal-as-root image would not exercise anything realistic. They apply to the
        # autogenerated test only -- scenarios name their own image, which is the point of them:
        # tidewave's musl_image is the only thing here that ever runs on Alpine.
        run: devcontainer features test --features ${{ matrix.feature }} -i ${{ matrix.image }} -u ${{ matrix.user }} .
