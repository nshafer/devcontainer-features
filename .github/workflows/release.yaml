name: Release features

on:
  workflow_dispatch:
  push:
    branches: [main]
    # test/** is here as well as src/**, so a push that only changes a test still runs the suite.
    # Such a push reaches the release job too, which is harmless: with no version bumped there is
    # nothing to publish and nothing to regenerate.
    paths: ['src/**', 'test/**']

jobs:
  # The whole test matrix, run from test.yaml rather than repeated here. Nothing is published
  # unless every feature in it passes.
  test:
    uses: ./.github/workflows/test.yaml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Publishes any feature whose version in devcontainer-feature.json is not already in the
      # registry, and regenerates each feature's README from its metadata.
      - uses: devcontainers/action@v1
        with:
          publish-features: 'true'
          base-path-to-features: './src'
          generate-docs: 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit regenerated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/*/README.md || true
          git diff --staged --quiet || git commit -m "Regenerate feature docs"
          git push || true
